# Runs the Python syntax check, ruff and pytest on the supported minimum and current interpreter.

name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:

jobs:
  python-ci:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.15"]
    uses: book000/templates/.github/workflows/reusable-python-ci.yml@master
    with:
      python-version: ${{ matrix.python-version }}
